default_timezone: UTC
model:
  llm:
    global:
      url: local://transformers/v1
      model_name: /data/predator/ly/Mem/models/Qwen3.5-9B
      key: EMPTY
      topk: 20
      top_p: 0.8
      max_token: 1024
      temperature: 0.7
    steps:
      extraction:
        model_name: global
        temperature: 0.0
        max_token: 4096
  embedding:
    global:
      url: local://transformers/v1
      model_name: /data/predator/ly/Mem/models/Qwen3-Embedding-8B
      key: EMPTY
      dimension: 4096
extraction:
  memcell_max_turns: 2
  memcell_max_chars: 8000
  memcell_max_time_gap_seconds: 21600
  memcell_hard_boundary_markers:
  - '--- topic'
  - '--- session'
  - 'new topic:'
  - switching gears
  max_items_per_cell: 15
  max_assistant_items_per_cell: 4
  max_topics_per_item: 3
  max_attribute_keys_per_item: 2
  max_domain_keys_per_item: 2
  max_collection_keys_per_item: 2
  max_workers: 1
  max_inflight_requests: 1
  fact_manager:
    enabled: false
    storage_dir: data/index/vnext_fact_manager
    persist_on_write: false
    top_k: 8
    similarity_threshold: 0.93
    max_llm_pairs_per_item: 4
    normalize_embeddings: true
tree:
  storage_dir: data/index/trees
  root_index_dir: data/index/root_index
  session:
    k: 3
    summary_max_words: 200
  entity:
    user_k: 8
    entity_k: 8
    active_min_facts: 3
    active_min_sessions: 2
    suppress_below_facts: 2
    max_user_tree_size: 500
    max_entity_tree_size: 100
    summary_max_words: 250
  scene:
    k: 10
    max_cluster_size: 150
    bootstrap_cluster_count: 20
    bootstrap_min_facts: 24
    bootstrap_max_facts: 400
    theta_assign: 0.65
    theta_second: 0.55
    theta_spawn: 0.54
    theta_merge: 0.88
    merge_check_interval: 500
    max_time_gap_days: 45
    summary_max_words: 200
  summary_manager:
    max_inflight: 1
    temperature: 0.0
    max_tokens: 4096
    top_p: 0.8
    max_retries: 0
    timeout_sec: 60.0
logger:
  api:
    enabled: true
    path: data/logs/src_api_calls.jsonl
  extraction:
    enabled: true
    path: data/logs/src_extraction_requests.jsonl
query:
  mode: agentic
  node_index_vector_dim: 1024
  recall:
    top_k: 10
    direction: union
    bu_top_m: 30
    force_entity_user: true
    llm_rerank: false
    llm_rerank_overfetch: 20
  browse:
    beam_width: 10
    max_facts: 0
    llm_guided: true
    llm_guided_all_types: true
    max_workers: 1
  planner:
    enabled: true
